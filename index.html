
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FamilyHealth & Docs</title>
    <script>
      // Suppress Tailwind production warning
      const originalWarn = console.warn;
      console.warn = (...args) => {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com should not be used in production')) return;
        originalWarn.apply(console, args);
      };
      
      window.onerror = function(message, source, lineno, colno, error) {
        console.error('[Global Error]', message, source, lineno, colno, error);
        const root = document.getElementById('root');
        if (root) {
            root.innerHTML = `<div style="color: red; padding: 20px;">
                <h3>Something went wrong</h3>
                <p>${message}</p>
            </div>`;
        }
      };
    </script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .material-symbols-outlined.fill {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        font-family: 'Manrope', sans-serif;
        background-color: #101d22; /* background-dark */
        color: #f6f8f8; /* text-primary-dark */
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#13b6ec",
              "background-light": "#f6f8f8",
              "background-dark": "#101d22",
              "card-light": "#ffffff",
              "card-dark": "#1a282d",
              "text-primary-light": "#101d22",
              "text-primary-dark": "#f6f8f8",
              "text-secondary-light": "#6b7280",
              "text-secondary-dark": "#9db2b9",
              "priority-p0": "#FF453A",
              "priority-p1": "#FF9F0A"
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"]
            },
          },
        },
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/"
  }
}
</script>
</head>
  <body>
    <div id="root" class="flex h-screen w-full items-center justify-center text-white">Loading App...</div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
